name: AgentLake — planificateur

# Questions de cadrage puis plan validé sur plan/vN, pour un projet AgentLake.
# Appelé par le workflow d'appel `agentlake-planner.yml` du projet : lancement depuis le cockpit
# (workflow_dispatch) ou réponse dans l'issue « Cadrage ».

on:
  workflow_call:
    inputs:
      mode:
        description: 'auto (questions puis plan) ou regenerate (nouveau plan)'
        type: string
        default: auto
      model:
        description: Modèle du planificateur (réglage du cockpit) ; vide = relu dans l'issue Cadrage
        type: string
        default: ''
      max_agents:
        description: Plafond global d'agents (réglage du cockpit) ; vide = relu dans l'issue Cadrage
        type: string
        default: ''
      instruction:
        description: Consigne libre de Kia pour (re)générer le plan
        type: string
        default: ''
      devlake_ref:
        description: Version de devlake qui fournit les scripts
        type: string
        default: v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

jobs:
  plan:
    name: Planification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agentlake-planner
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    env:
      RUNTIME: .agentlake-runtime
    steps:
      - name: Dépôt du projet
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Scripts AgentLake (devlake ${{ inputs.devlake_ref }})
        uses: actions/checkout@v4
        with:
          repository: kiamiya/devlake
          ref: ${{ inputs.devlake_ref }}
          path: ${{ env.RUNTIME }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer et compiler les scripts, installer le CLI Claude Code
        working-directory: ${{ env.RUNTIME }}
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc -b tsconfig.build.json
          npm install --global @anthropic-ai/claude-code

      - name: Planifier
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODE: ${{ inputs.mode }}
          MODEL: ${{ inputs.model }}
          MAX_AGENTS: ${{ inputs.max_agents }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: node "$RUNTIME/packages/planner/dist/cli.js"
