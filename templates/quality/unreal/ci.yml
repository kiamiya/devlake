# Gabarit AgentLake, profil qualité « unreal » : CI du projet, posée par la tâche bootstrap.
# Les noms de jobs sont des checks obligatoires de la protection de main : ne pas les renommer.
# Adapter les commandes à la stack réelle du projet ; un job ne doit jamais être vidé ou sauté.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: lint
        run: bash scripts/ci/lint.sh
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: typecheck
        run: bash scripts/ci/typecheck.sh
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: unit-tests
        run: bash scripts/ci/unit-tests.sh
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: integration-tests
        run: bash scripts/ci/integration-tests.sh
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: build
        run: bash scripts/ci/build.sh
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: dependency-audit
        run: bash scripts/ci/dependency-audit.sh
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Détection de secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source /repo --redact --verbose
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: none
      - uses: github/codeql-action/analyze@v3
