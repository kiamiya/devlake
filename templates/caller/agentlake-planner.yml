# Généré par AgentLake : relancer le bootstrap plutôt que modifier ce fichier.
name: AgentLake — planificateur

on:
  # Lancé par le cockpit.
  workflow_dispatch:
    inputs:
      mode:
        description: Mode
        type: choice
        options: [auto, regenerate, inventory]
        default: auto
      model:
        description: Modèle du planificateur
        type: string
        default: ''
      max_agents:
        description: Plafond global d'agents
        type: string
        default: ''
      instruction:
        description: Consigne libre pour (re)générer le plan
        type: string
        default: ''
  # Relancé par une réponse dans l'issue « Cadrage ».
  issue_comment:
    types: [created]

permissions: {}

# Pas de groupe de concurrence ici : le job appelé a déjà `agentlake-planner`
# (le même groupe à deux niveaux bloquerait le job indéfiniment).

jobs:
  plan:
    # Seul Kia (AGENTLAKE_OWNER, ou le propriétaire du dépôt) déclenche le planificateur,
    # et seulement depuis l'issue Cadrage.
    if: >-
      github.event.sender.login == (vars.AGENTLAKE_OWNER || github.repository_owner) &&
      (github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'agentlake:cadrage'))
    permissions:
      contents: write
      issues: write
      pull-requests: read
    uses: __DEVLAKE_REPOSITORY__/.github/workflows/planner.yml@__DEVLAKE_REF__
    with:
      mode: ${{ inputs.mode || 'auto' }}
      model: ${{ inputs.model || '' }}
      max_agents: ${{ inputs.max_agents || '' }}
      instruction: ${{ inputs.instruction || '' }}
      devlake_ref: __DEVLAKE_REF__
    secrets: inherit
