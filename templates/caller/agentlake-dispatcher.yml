# Généré par AgentLake : relancer le bootstrap plutôt que modifier ce fichier.
name: AgentLake — dispatcher

on:
  schedule:
    # Passe de rattrapage toutes les 10 minutes.
    - cron: '*/10 * * * *'
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: agentlake-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    # Seuls les événements dont l'auteur est le propriétaire du dépôt déclenchent quelque chose.
    if: github.event_name == 'schedule' || github.event.sender.login == github.repository_owner
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
    uses: __DEVLAKE_REPOSITORY__/.github/workflows/dispatcher.yml@__DEVLAKE_REF__
    secrets: inherit
